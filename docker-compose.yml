name: adflow

x-backend-environment: &backend-environment
  # Container DNS differs from the host URLs in .env.example.
  ADFLOW_DATABASE_URL: postgresql+psycopg://adflow:adflow@postgres:5432/adflow
  ADFLOW_TEST_DATABASE_URL: postgresql+psycopg://adflow:adflow@postgres:5432/adflow_test
  ADFLOW_LOG_LEVEL: ${ADFLOW_LOG_LEVEL:-INFO}
  ADFLOW_DB_CONNECT_TIMEOUT_SECONDS: ${ADFLOW_DB_CONNECT_TIMEOUT_SECONDS:-5}
  ADFLOW_DB_POOL_TIMEOUT_SECONDS: ${ADFLOW_DB_POOL_TIMEOUT_SECONDS:-5}
  ADFLOW_DB_STATEMENT_TIMEOUT_SECONDS: ${ADFLOW_DB_STATEMENT_TIMEOUT_SECONDS:-5}
  ADFLOW_DB_LOCK_TIMEOUT_SECONDS: ${ADFLOW_DB_LOCK_TIMEOUT_SECONDS:-3}
  ADFLOW_DB_POOL_SIZE: ${ADFLOW_DB_POOL_SIZE:-5}
  ADFLOW_DB_MAX_OVERFLOW: ${ADFLOW_DB_MAX_OVERFLOW:-5}
  ADFLOW_RETRIEVAL_CANDIDATE_LIMIT: ${ADFLOW_RETRIEVAL_CANDIDATE_LIMIT:-500}
  ADFLOW_RETRIEVAL_SEARCH_LIMIT: ${ADFLOW_RETRIEVAL_SEARCH_LIMIT:-4000}
  ADFLOW_RETRIEVAL_INDEX_PATH: ${ADFLOW_RETRIEVAL_INDEX_PATH:-}
  ADFLOW_CTR_MODEL_PATH: ${ADFLOW_CTR_MODEL_PATH:-}
  ADFLOW_RANKING_STRATEGY: ${ADFLOW_RANKING_STRATEGY:-interest-overlap}
  ADFLOW_REDIS_URL: ${ADFLOW_REDIS_URL-redis://redis:6379/0}
  ADFLOW_REDIS_POOL_MAX_CONNECTIONS: ${ADFLOW_REDIS_POOL_MAX_CONNECTIONS:-8}
  ADFLOW_REDIS_CONNECT_TIMEOUT_SECONDS: ${ADFLOW_REDIS_CONNECT_TIMEOUT_SECONDS:-0.1}
  ADFLOW_REDIS_SOCKET_TIMEOUT_SECONDS: ${ADFLOW_REDIS_SOCKET_TIMEOUT_SECONDS:-0.1}
  ADFLOW_REDIS_PROFILE_TTL_SECONDS: ${ADFLOW_REDIS_PROFILE_TTL_SECONDS:-60}

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: adflow
      POSTGRES_PASSWORD: adflow
      POSTGRES_DB: adflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adflow -d adflow"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  redis:
    image: redis:8.0.2-bookworm@sha256:b43d2dcbbdb1f9e1582e3a0f37e53bf79038522ccffb56a25858969d7a9b6c11
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    mem_limit: 192m
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15

  backend:
    image: adflow-backend:phase1
    build:
      context: ./backend
    environment: *backend-environment
    ports:
      - "127.0.0.1:${ADFLOW_API_PORT:-8000}:8000"
    volumes:
      - index_artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  benchmark-api:
    image: adflow-backend:phase1
    build:
      context: ./backend
    container_name: adflow-benchmark-api
    profiles: [benchmark]
    command:
      ["python", "-m", "uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      <<: *backend-environment
      ADFLOW_DATABASE_URL: ${ADFLOW_BENCHMARK_DATABASE_URL:-postgresql+psycopg://adflow:adflow@postgres:5432/adflow_benchmark}
      ADFLOW_TEST_DATABASE_URL: postgresql+psycopg://adflow:adflow@postgres:5432/adflow_test
    ports:
      - "127.0.0.1:${ADFLOW_BENCHMARK_API_PORT:-18001}:8000"
    volumes:
      - index_artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    image: adflow-dashboard:phase7
    build:
      context: ./frontend
    environment:
      PORT: "8080"
      STATIC_DIR: /app/dist
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5174:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  index_artifacts:
