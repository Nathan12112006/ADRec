[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "adflow-backend"
version = "0.1.0"
description = "AdFlow synthetic advertising recommendation backend"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<1",
  "faiss-cpu==1.15.1",
    "numpy==2.2.6; python_version < '3.14'",
    "numpy==2.3.5; python_version >= '3.14'",
]

[dependency-groups]
dev = [
  "hatchling>=1.27,<2",
  "httpx2>=2,<3",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
adflow-seed = "app.seeding.cli:main"
adflow-index = "app.retrieval.cli:main"
adflow-retrieval-benchmark = "app.retrieval.benchmark_cli:main"
adflow-history = "app.history.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]
